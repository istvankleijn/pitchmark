[project]
name = "pitchmark"
version = "0.4.0a0"
description = "Exploring golf shot strategy."
authors = [{ name = "Istvan Kleijn" }]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "shapely>=2.0.1,<3",
    "osmium>=3.6.0,<4",
    "geopandas>=0.12.2,<0.13",
    "pandas>=1.5.3,<2",
    "altair>=4.2.2,<5",
    "laspy>=2.4.1,<3",
    "laszip>=0.2.2,<0.3",
    "pyproj>=3.4.1,<4",
    "open3d==0.16.0",
    "numpy>=1.24.2,<2",
    "scipy>=1.10.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.2.1,<8",
    "pytest-cov>=4.0.0,<5",
    "myst-nb>=0.17.1,<0.18",
    "sphinx-autoapi>=2.0.1,<3",
    "sphinx-rtd-theme>=1.1.1,<2",
    "python-semantic-release>=10.6.1,<11",
    "ruff>=0.15.0,<0.16",
    "pre-commit>=4.0.0,<5",
    "nbstripout>=0.9.1,<0.10",
    "jupyter>=1.0.0,<2",
    "setuptools<82",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_variables = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false                       # do not bump to 1.0.0 automatically
tag_format = "v{version}"
build_command = """
    python -m pip install "uv~=0.11.29"
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
commit_author = "github-actions <actions@users.noreply.github.com>"

[tool.semantic_release.branches.main]
match = "main"                              # branch to make releases of
prerelease = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"             # changelog file
output_format = "md"

[tool.semantic_release.publish]
upload_to_vcs_release = true                # auto-create GitHub release
dist_glob_patterns = ["dist/*"]             # where to find dists

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = ["E203"] # whitespace before ':' - conflicts with ruff format on slices

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
