[project]
name = "pitchmark"
version = "0.4.0a0"
description = "Exploring golf shot strategy."
authors = [{ name = "Istvan Kleijn" }]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "shapely>=2.0.1,<3",
    "osmium>=3.6.0,<4",
    "geopandas>=0.12.2,<0.13",
    "pandas>=1.5.3,<2",
    "altair>=4.2.2,<5",
    "laspy>=2.4.1,<3",
    "laszip>=0.2.2,<0.3",
    "pyproj>=3.4.1,<4",
    "open3d==0.16.0",
    "numpy>=1.24.2,<2",
    "scipy>=1.10.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.2.1,<8",
    "pytest-cov>=4.0.0,<5",
    "myst-nb>=0.17.1,<0.18",
    "sphinx-autoapi>=2.0.1,<3",
    "sphinx-rtd-theme>=1.1.1,<2",
    "python-semantic-release>=7.33.0,<8",
    "ruff>=0.15.0,<0.16",
    "pre-commit>=4.0.0,<5",
    "nbstripout>=0.9.1,<0.10",
    "jupyter>=1.0.0,<2",
    "setuptools<82",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_variable = "pyproject.toml:version" # version location
version_source = "tag"                      # get the current version from latest tag matching vX.Y.Z
commit_version_number = true                # write version even though it is read from tags
branch = "main"                             # branch to make releases of
changelog_file = "CHANGELOG.md"             # changelog file
build_command = "uv build"                  # build dists
dist_path = "dist/"                         # where to put dists
upload_to_release = true                    # auto-create GitHub release
upload_to_pypi = false                      # don't auto-upload to PyPI
remove_dist = false                         # don't remove dists
patch_without_tag = true                    # patch release by default
major_on_zero = false                       # do not bump to 1.0.0 automatically

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = ["E203"] # whitespace before ':' - conflicts with ruff format on slices

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
